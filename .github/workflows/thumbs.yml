name: Fetch index thumbnails

# The six index builds without a screenshot get Mousa's own thumbnails from his builds index
# (scripts/capture/thumbs.mjs). Commits capture/raw/<build>/desktop-hero.webp and capture/reports/thumbs.json.
on:
  push:
    branches: ['claude/determined-lamport-4blt8a']
    paths: ['.github/workflows/thumbs.yml', 'scripts/capture/thumbs.mjs']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: thumbs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch
        run: node scripts/capture/thumbs.mjs
      - name: Commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capture/raw capture/reports/thumbs.json
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Index thumbnails from Mousa's builds index [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep $((i * 5))
          done
          exit 1
