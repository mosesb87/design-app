name: Scan the hosting (public)

# Public scan of Mousa's domains and the client sites on the archive: subdomains from certificate logs, sitemaps,
# public WordPress REST dates, page metadata and headers (scripts/capture/hosting.mjs). No logins, no changes to
# any site. Results are committed to capture/hosting/.
on:
  push:
    branches: ['claude/determined-lamport-4blt8a']
    paths: ['.github/workflows/hosting.yml', 'scripts/capture/hosting.mjs']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hosting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan
        run: node scripts/capture/hosting.mjs
      - name: Commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capture/hosting
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Hosting scan: subdomains, sitemaps, WordPress dates and page dates [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep $((i * 5))
          done
          exit 1
