<style>
:root{--ink:#0B0B0B;--paper:#ECEAE3;--ember:#E96B3B;--ember-deep:#A8441A;--soft:#55524a}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;display:grid;place-items:center;padding:32px 16px}
::selection{background:var(--ember);color:#fff}
main{max-width:640px}
.k{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ember-deep)}
h1{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(48px,10vw,96px);line-height:.95;letter-spacing:-.02em;margin:18px 0 22px}
p{font-size:17px;line-height:1.6;color:var(--soft);max-width:46ch}
a.back{display:inline-block;margin-top:30px;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--ink);border-radius:100px;padding:12px 20px;transition:background .2s,color .2s}
a.back:hover{background:var(--ink);color:var(--paper)}
a.back:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
</style>
</head>
